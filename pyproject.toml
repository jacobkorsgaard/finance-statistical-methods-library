[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-statistical-methods-library"
version = "0.2.0"
description = "Educational finance notebooks with focused reusable statistical implementations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "statsmodels>=0.14.5",
    "pmdarima>=2.1,<3",
    "arch>=7.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["finstats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
